name: Deploy Trigger.dev

# Trigger.dev runs its own copy of the app's background tasks — the crawl
# dispatch, the daily crawl, the crawl watchdog, escalation-email retries —
# built from aigenic_app/trigger and everything it imports (lib/sites/*,
# db/schema.ts, …). Vercel never deploys it. Without this workflow those
# tasks keep running whatever code was last deployed by hand, however much
# main has moved: that's how crawls kept going out without the crawler access
# key, and how stale cleanup code could delete owner-added documents.
#
# Deploys only main, and only after CI passed on that exact commit, so a
# commit that fails lint, types, tests or the migration check never ships.
#
# Needs one repository secret: TRIGGER_ACCESS_TOKEN — a personal access token
# from the Trigger.dev dashboard (Account → Personal Access Tokens). Without
# it the job warns and stops rather than failing main's status forever.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual run (Actions tab → Deploy Trigger.dev → Run workflow), e.g. right
  # after adding the secret.
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer main supersedes a queued older one.
  group: deploy-trigger
  cancel-in-progress: false

jobs:
  deploy:
    name: trigger.dev deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
    steps:
      - name: Check for the access token
        id: token
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::warning title=Trigger.dev not deployed::Add a TRIGGER_ACCESS_TOKEN repository secret (Trigger.dev → Account → Personal Access Tokens) so background tasks deploy with main. Until then they run whatever was last deployed by hand."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          # The commit CI just passed — not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # CLI pinned to the SDK version in aigenic_app/package.json — a CLI/SDK
      # mismatch fails the deploy. Bump both together. The build runs on
      # Trigger.dev's side; the task env vars (DATABASE_URL, SCRAPER_API_URL,
      # SCRAPER_API_KEY, …) live in the Trigger.dev dashboard, not here.
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        working-directory: aigenic_app
        run: npx --yes trigger.dev@4.7.4 deploy --skip-update-check
